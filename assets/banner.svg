<svg width="100%" viewBox="0 0 1200 480" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>career-ops-india — AI-Powered Job Search Engine</title>
  <desc>Autonomous multi-tier job search, zero-ban scraping, and AI evaluation pipeline for the Indian tech market</desc>

  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bg-glow-saffron" cx="15%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bg-glow-cyan" cx="85%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bg-glow-emerald" cx="30%" cy="90%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Gradients -->
    <linearGradient id="flag-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="35%" stop-color="#FF9933" />
      <stop offset="48%" stop-color="#ffffff" />
      <stop offset="52%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#138808" />
      <stop offset="100%" stop-color="#138808" />
    </linearGradient>

    <linearGradient id="title-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="saffron-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="60%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="40%" stop-color="#1e293b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="result-box-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow-card" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0284c7" flood-opacity="0.12" />
    </filter>

    <filter id="badge-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="tech-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.22" />
      <circle cx="30" cy="0" r="1" fill="#475569" fill-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="1200" height="480" rx="20" fill="#090d16" />

  <!-- Ambient Glow Meshes -->
  <rect width="1200" height="480" rx="20" fill="url(#bg-glow-saffron)" />
  <rect width="1200" height="480" rx="20" fill="url(#bg-glow-cyan)" />
  <rect width="1200" height="480" rx="20" fill="url(#bg-glow-emerald)" />

  <!-- Background Tech Grid Overlay -->
  <rect width="1200" height="480" rx="20" fill="url(#tech-grid)" />

  <!-- Top Laser Accent Bar (Indian Tricolor Motif) -->
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#flag-bar)" />
  <rect x="0" y="4" width="1200" height="1" fill="#ffffff" fill-opacity="0.08" />

  <!-- ========================================================================= -->
  <!-- LEFT COLUMN: BRANDING, HEADLINE, VALUE PROPS, BADGES                     -->
  <!-- ========================================================================= -->

  <!-- Status / Pill Badge -->
  <g transform="translate(60, 52)">
    <rect width="290" height="30" rx="15" fill="#111827" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.4" />
    <circle cx="16" cy="15" r="4.5" fill="#10b981" filter="url(#badge-glow)" />
    <circle cx="16" cy="15" r="2.5" fill="#ffffff" />
    <text x="30" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#38bdf8" letter-spacing="1">MULTI-TIER AI JOB ENGINE • v2.0</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(60, 138)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="52" font-weight="900" letter-spacing="-1.5">
      <tspan fill="url(#title-gradient)">career-ops-</tspan><tspan fill="url(#saffron-gradient)">india</tspan>
    </text>
  </g>

  <!-- Subtitle & Mission Statement -->
  <g transform="translate(60, 175)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#e2e8f0" letter-spacing="-0.3">
      Autonomous Job Hunter for the Indian Tech Market
    </text>
    <text y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#94a3b8">
      Zero-ban ATS APIs • Multi-board JobSpy • 10-Dim AI Fit Scoring • Auto-Tailoring
    </text>
  </g>

  <!-- Feature Pill Tags - Row 1 -->
  <g transform="translate(60, 248)">
    <!-- Pill 1: 250+ ATS Companies -->
    <rect width="144" height="32" rx="16" fill="#161e2e" stroke="#334155" stroke-width="0.8" />
    <text x="14" y="20.5" font-size="13">🏢</text>
    <text x="36" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">250+ Companies</text>

    <!-- Pill 2: Zero Ban Risk -->
    <rect x="154" width="138" height="32" rx="16" fill="#161e2e" stroke="#10b981" stroke-width="0.8" stroke-opacity="0.4" />
    <text x="168" y="20.5" font-size="13">🛡️</text>
    <text x="190" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#34d399">Zero-Ban APIs</text>

    <!-- Pill 3: Claude + Gemini -->
    <rect x="302" width="168" height="32" rx="16" fill="#161e2e" stroke="#f97316" stroke-width="0.8" stroke-opacity="0.4" />
    <text x="316" y="20.5" font-size="13">🤖</text>
    <text x="338" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#fb923c">Claude Code + Gemini</text>
  </g>

  <!-- Feature Pill Tags - Row 2 -->
  <g transform="translate(60, 292)">
    <!-- Pill 4: JobSpy Engine -->
    <rect width="148" height="32" rx="16" fill="#161e2e" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4" />
    <text x="14" y="20.5" font-size="13">⚡</text>
    <text x="36" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#38bdf8">JobSpy TLS Spoof</text>

    <!-- Pill 5: 10-Dim AI Matcher -->
    <rect x="158" width="146" height="32" rx="16" fill="#161e2e" stroke="#a855f7" stroke-width="0.8" stroke-opacity="0.4" />
    <text x="172" y="20.5" font-size="13">🎯</text>
    <text x="194" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#c084fc">10-Dim AI Match</text>

    <!-- Pill 6: SQLite Local-First -->
    <rect x="314" width="156" height="32" rx="16" fill="#161e2e" stroke="#64748b" stroke-width="0.8" stroke-opacity="0.5" />
    <text x="328" y="20.5" font-size="13">💾</text>
    <text x="350" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">Local SQLite Store</text>
  </g>

  <!-- Highlights / Privacy Guarantee Line -->
  <g transform="translate(60, 362)">
    <circle cx="6" cy="6" r="3" fill="#10b981" />
    <text x="18" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#94a3b8">100% Local &amp; Privacy-First — Zero Cloud Data Leakage</text>

    <circle cx="6" cy="28" r="3" fill="#38bdf8" />
    <text x="18" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#94a3b8">Single-Column Semantic HTML to ATS-Safe PDF Generation</text>
  </g>

  <!-- Bottom Brand Footer -->
  <g transform="translate(60, 442)">
    <text font-family="'Fira Code', monospace, sans-serif" font-size="11" fill="#475569">github.com/AnojSKunte/career-ops-india</text>
    <text x="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#475569" text-anchor="end">Inspired by career-ops • Rebuilt for India 🇮🇳</text>
  </g>

  <!-- ========================================================================= -->
  <!-- RIGHT COLUMN: INTERACTIVE GLASS TERMINAL / HUD CARD                      -->
  <!-- ========================================================================= -->

  <g transform="translate(565, 48)" filter="url(#shadow-card)">
    <!-- Main Terminal Container -->
    <rect width="575" height="382" rx="14" fill="url(#card-bg)" stroke="url(#card-border)" stroke-width="1.2" />

    <!-- Terminal Header Bar -->
    <path d="M 0 14 C 0 6.268 6.268 0 14 0 L 561 0 C 568.732 0 575 6.268 575 14 L 575 38 L 0 38 Z" fill="#131c2e" />
    <line x1="0" y1="38" x2="575" y2="38" stroke="#1e293b" stroke-width="1" />

    <!-- macOS Window Traffic Lights -->
    <circle cx="20" cy="19" r="5.5" fill="#ef4444" />
    <circle cx="38" cy="19" r="5.5" fill="#f59e0b" />
    <circle cx="56" cy="19" r="5.5" fill="#10b981" />

    <!-- Terminal Title -->
    <text x="287" y="23" font-family="'Fira Code', Menlo, monospace" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">
      career-ops-engine v2.0 • zsh
    </text>

    <!-- Terminal Status Badge -->
    <rect x="472" y="10" width="88" height="18" rx="9" fill="#064e3b" stroke="#059669" stroke-width="0.6" />
    <circle cx="482" cy="19" r="3" fill="#34d399" />
    <text x="492" y="22.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#34d399" letter-spacing="0.5">READY</text>

    <!-- Terminal Body Text Lines -->
    <g transform="translate(24, 66)" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace">
      <!-- Command 1 -->
      <text y="0" font-size="12" font-weight="700" fill="#38bdf8">❯</text>
      <text x="16" y="0" font-size="12" font-weight="600" fill="#f8fafc">python main.py scan --safe</text>

      <!-- Execution Progress -->
      <g transform="translate(0, 24)" font-size="10.5">
        <text y="0" fill="#64748b">17:31:02 │ Tier 1 [ATS Direct]</text>
        <text x="186" y="0" fill="#94a3b8">Greenhouse, Lever, Ashby</text>
        <text x="480" y="0" fill="#34d399" font-weight="600" text-anchor="end">296 jobs</text>

        <text y="18" fill="#64748b">17:31:03 │ Tier 2 [Aggregators]</text>
        <text x="186" y="18" fill="#94a3b8">Remotive, Arbeitnow, Adzuna</text>
        <text x="480" y="18" fill="#38bdf8" font-weight="600" text-anchor="end">19 jobs</text>

        <text y="36" fill="#64748b">17:31:04 │ Tier 3 [RSS Feeds]</text>
        <text x="186" y="36" fill="#94a3b8">WeWorkRemotely, Himalayas</text>
        <text x="480" y="36" fill="#c084fc" font-weight="600" text-anchor="end">109 jobs</text>

        <!-- Ingestion Success Banner -->
        <g transform="translate(0, 54)">
          <rect width="527" height="26" rx="6" fill="#064e3b" fill-opacity="0.3" stroke="#059669" stroke-width="0.8" />
          <text x="12" y="17" font-size="11" font-weight="700" fill="#34d399">✔ 424 active jobs ingested &amp; deduplicated → SQLite [1.2s]</text>
        </g>
      </g>

      <!-- Command 2: Results Query -->
      <g transform="translate(0, 130)">
        <text y="0" font-size="12" font-weight="700" fill="#38bdf8">❯</text>
        <text x="16" y="0" font-size="12" font-weight="600" fill="#f8fafc">python main.py results --grade A</text>
      </g>

      <!-- High Match Card Inside Terminal -->
      <g transform="translate(0, 150)">
        <rect width="527" height="98" rx="8" fill="url(#result-box-bg)" stroke="#334155" stroke-width="0.8" />
        
        <!-- Grade Badge -->
        <rect x="14" y="14" width="32" height="32" rx="6" fill="#047857" stroke="#10b981" stroke-width="0.8" />
        <text x="30" y="35.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="17" font-weight="900" fill="#ffffff" text-anchor="middle">A</text>

        <!-- Job Details -->
        <text x="56" y="27" font-size="12" font-weight="700" fill="#f8fafc">InMobi • Product Analyst II</text>
        <text x="56" y="42" font-size="10.5" fill="#94a3b8">Bengaluru, IN • Tier 1 Fintech • ₹16 - 22 LPA</text>

        <!-- Metric Bars / Tags -->
        <text x="14" y="66" font-size="10" fill="#cbd5e1">Match Score: <tspan fill="#34d399" font-weight="700">4.82 / 5.0</tspan> (Role 95%, Salary 100%, Tech Stack 92%)</text>
        <text x="14" y="84" font-size="10" fill="#94a3b8">Skills overlap: <tspan fill="#38bdf8">SQL, Python, Product Analytics, Metabase, A/B Testing</tspan></text>

        <!-- Status Tag -->
        <rect x="424" y="14" width="90" height="20" rx="4" fill="#1e3a5f" stroke="#0284c7" stroke-width="0.6" />
        <text x="469" y="27.5" font-size="9.5" font-weight="700" fill="#38bdf8" text-anchor="middle">APPLY READY</text>
      </g>

      <!-- Bottom Platform Bar Inside Terminal -->
      <g transform="translate(0, 274)">
        <line x1="0" y1="0" x2="527" y2="0" stroke="#1e293b" stroke-width="0.8" />
        <text x="4" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#64748b">
          Supported: <tspan fill="#94a3b8">Greenhouse</tspan> • <tspan fill="#94a3b8">Lever</tspan> • <tspan fill="#94a3b8">Ashby</tspan> • <tspan fill="#94a3b8">Workday</tspan> • <tspan fill="#94a3b8">LinkedIn</tspan> • <tspan fill="#94a3b8">Naukri</tspan> • <tspan fill="#94a3b8">Indeed</tspan>
        </text>
      </g>
    </g>
  </g>
</svg>